name: Publish to PyPI

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to publish (e.g. 1.0.0)'
        required: true
        type: string

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Get version
        id: version
        run: |
          VERSION=$(nix shell 'nixpkgs#uv' -c uv version | awk '{print $2}')
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check published version
        id: pypi_check
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/cryoflow/$VERSION/json")
          if [ "$STATUS" = "200" ]; then
            echo "on_pypi=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_pypi=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build all packages
        if: steps.pypi_check.outputs.on_pypi == 'false'
        run: nix shell nixpkgs#uv -c uv build --all-packages

      - name: Publish to PyPI
        if: steps.pypi_check.outputs.on_pypi == 'false'
        run: nix shell nixpkgs#uv -c uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
